<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fitness Couch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8f7">
<meta name="description" content="Simple home fitness and GPS run tracker. Works offline, stores data on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main id="view" aria-live="polite"></main>
<nav class="tabs" role="tablist" aria-label="Main">
  <button class="tab" data-v="home" role="tab"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button class="tab" data-v="running" role="tab"><svg viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="2"/><path d="m9 21 2.5-6-2.5-2.5 1.5-4.5 3 2.5 3 1M7 11l3-3 3 .5M13 14.5l3 2.5v4"/></svg><span>Running</span></button>
  <button class="tab" data-v="exercise" role="tab"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Exercise</span></button>
</nav>
<div id="toast" role="status"></div>
<noscript>Fitness Couch needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
